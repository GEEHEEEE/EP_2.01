<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>02 — Рецепт</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #e8e8e8; padding: 24px; color: #333; font-size: 14px;
  }
  .screen {
    background: #fff; border: 2px solid #555; border-radius: 4px;
    width: 900px; margin: 0 auto; overflow: hidden;
  }
  .titlebar {
    background: #d0d0d0; padding: 12px 16px; border-bottom: 1px solid #999;
    display: flex; justify-content: space-between; align-items: center;
  }
  .titlebar .left { font-weight: 600; }
  .titlebar .right { display: flex; gap: 8px; }
  .btn {
    padding: 8px 14px; border: 1px solid #777; background: #e0e0e0;
    border-radius: 3px; font-size: 13px; cursor: pointer; color: #333;
  }
  .btn:hover { background: #d5d5d5; }
  .btn.small { padding: 4px 8px; font-size: 12px; }
  .content { padding: 20px; }
  .field { margin-bottom: 14px; display: flex; align-items: flex-start; }
  .field label {
    width: 130px; padding-top: 8px; font-size: 13px; color: #555; font-weight: 600;
  }
  .field input, .field select, .field textarea {
    flex: 1; padding: 8px 10px; border: 1px solid #999;
    background: #fff; border-radius: 3px; font-size: 13px; color: #333;
    font-family: inherit;
  }
  .field textarea { height: 60px; resize: none; }
  .section-title {
    font-weight: 600; margin: 24px 0 10px 0; font-size: 14px;
    color: #444; border-bottom: 1px solid #ccc; padding-bottom: 6px;
    display: flex; justify-content: space-between; align-items: center;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; background: #e8e8e8; padding: 8px 10px;
    border: 1px solid #bbb; font-weight: 600; color: #444;
  }
  td { padding: 8px 10px; border: 1px solid #ddd; color: #555; }
  .footer { padding: 16px 20px; border-top: 1px solid #ccc; text-align: center; }
</style>
</head>
<body>
<div class="screen">
  <div class="titlebar">
    <div class="left">← Назад &nbsp;&nbsp; Рецепт: Борщ</div>
    <div class="right">
      <button class="btn">Сохранить</button>
      <button class="btn">Отмена</button>
    </div>
  </div>
  <div class="content">
    <div class="field">
      <label>Название:</label>
      <input type="text" value="Борщ">
    </div>
    <div class="field">
      <label>Категория:</label>
      <select><option>Супы</option></select>
    </div>
    <div class="field">
      <label>Порций:</label>
      <input type="text" value="4" style="max-width: 100px;">
    </div>
    <div class="field">
      <label>Описание:</label>
      <textarea>Классический борщ с говядиной и сметаной.</textarea>
    </div>

    <div class="section-title">
      <span>Состав</span>
      <button class="btn small">+ Добавить ингредиент</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Ингредиент</th>
          <th style="width: 120px;">Количество</th>
          <th style="width: 100px;">Единица</th>
          <th style="width: 80px;">Действие</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>Свёкла</td><td>300</td><td>г</td><td><button class="btn small">Удалить</button></td></tr>
        <tr><td>Капуста</td><td>200</td><td>г</td><td><button class="btn small">Удалить</button></td></tr>
        <tr><td>Мясо</td><td>500</td><td>г</td><td><button class="btn small">Удалить</button></td></tr>
        <tr><td>Картофель</td><td>300</td><td>г</td><td><button class="btn small">Удалить</button></td></tr>
      </tbody>
    </table>
  </div>
  <div class="footer">
    <button class="btn">Масштабировать порции</button>
  </div>
</div>
</body>
</html>
