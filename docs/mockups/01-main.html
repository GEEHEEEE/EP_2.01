<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>01 — Главный экран</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #e8e8e8;
    padding: 24px;
    color: #333;
    font-size: 14px;
  }
  .screen {
    background: #fff;
    border: 2px solid #555;
    border-radius: 4px;
    width: 900px;
    margin: 0 auto;
    overflow: hidden;
  }
  .titlebar {
    background: #d0d0d0;
    padding: 12px 16px;
    border-bottom: 1px solid #999;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 600;
  }
  .toolbar {
    padding: 12px 16px;
    border-bottom: 1px solid #ccc;
    display: flex;
    gap: 8px;
    align-items: center;
    background: #f5f5f5;
  }
  input.search {
    flex: 1;
    padding: 8px 12px;
    border: 1px solid #999;
    background: #fff;
    border-radius: 3px;
    font-size: 13px;
    color: #888;
  }
  .btn {
    padding: 8px 14px;
    border: 1px solid #777;
    background: #e0e0e0;
    border-radius: 3px;
    font-size: 13px;
    cursor: pointer;
    color: #333;
    white-space: nowrap;
  }
  .btn:hover { background: #d5d5d5; }
  .btn.small { padding: 4px 8px; font-size: 12px; }
  .body {
    display: flex;
    min-height: 380px;
  }
  .sidebar {
    width: 180px;
    border-right: 1px solid #ccc;
    padding: 12px;
    background: #fafafa;
  }
  .sidebar-title {
    font-weight: 600;
    margin-bottom: 10px;
    font-size: 13px;
    color: #555;
  }
  .cat {
    padding: 6px 8px;
    margin-bottom: 4px;
    border-radius: 3px;
    color: #444;
    font-size: 13px;
  }
  .cat.active { background: #d8d8d8; font-weight: 600; }
  .main {
    flex: 1;
    padding: 12px 16px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th {
    text-align: left;
    background: #e8e8e8;
    padding: 8px 10px;
    border: 1px solid #bbb;
    font-weight: 600;
    color: #444;
  }
  td {
    padding: 8px 10px;
    border: 1px solid #ddd;
    color: #555;
  }
  .actions { display: flex; gap: 4px; }
  .placeholder {
    color: #aaa;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="screen">
  <div class="titlebar">
    <span>Кулинарная книга</span>
    <span style="font-weight: 400; font-size: 13px; color:#555;">Справочники ▾</span>
  </div>
  <div class="toolbar">
    <input class="search" type="text" placeholder="Поиск по названию..." readonly>
    <button class="btn">+ Добавить рецепт</button>
    <button class="btn">Список покупок</button>
  </div>
  <div class="body">
    <div class="sidebar">
      <div class="sidebar-title">Категории</div>
      <div class="cat active">Все рецепты</div>
      <div class="cat">Супы</div>
      <div class="cat">Салаты</div>
      <div class="cat">Выпечка</div>
      <div class="cat">Напитки</div>
      <div class="cat">Десерты</div>
    </div>
    <div class="main">
      <table>
        <thead>
          <tr>
            <th>Название</th>
            <th>Категория</th>
            <th>Порций</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Борщ</td><td>Супы</td><td>4</td>
            <td><div class="actions">
              <button class="btn small">Открыть</button>
              <button class="btn small">Изменить</button>
              <button class="btn small">Удалить</button>
            </div></td>
          </tr>
          <tr>
            <td>Оливье</td><td>Салаты</td><td>6</td>
            <td><div class="actions">
              <button class="btn small">Открыть</button>
              <button class="btn small">Изменить</button>
              <button class="btn small">Удалить</button>
            </div></td>
          </tr>
          <tr>
            <td>Блины</td><td>Выпечка</td><td>3</td>
            <td><div class="actions">
              <button class="btn small">Открыть</button>
              <button class="btn small">Изменить</button>
              <button class="btn small">Удалить</button>
            </div></td>
          </tr>
          <tr>
            <td>Компот из ягод</td><td>Напитки</td><td>8</td>
            <td><div class="actions">
              <button class="btn small">Открыть</button>
              <button class="btn small">Изменить</button>
              <button class="btn small">Удалить</button>
            </div></td>
          </tr>
          <tr>
            <td class="placeholder">...</td>
            <td class="placeholder">...</td>
            <td class="placeholder">...</td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
</body>
</html>
