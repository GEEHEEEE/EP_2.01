<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>03 — Справочник ингредиентов</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #e8e8e8; padding: 24px; color: #333; font-size: 14px;
  }
  .screen {
    background: #fff; border: 2px solid #555; border-radius: 4px;
    width: 900px; margin: 0 auto; overflow: hidden;
  }
  .titlebar {
    background: #d0d0d0; padding: 12px 16px; border-bottom: 1px solid #999;
    display: flex; justify-content: space-between; align-items: center;
  }
  .titlebar .left { font-weight: 600; }
  .btn {
    padding: 8px 14px; border: 1px solid #777; background: #e0e0e0;
    border-radius: 3px; font-size: 13px; cursor: pointer; color: #333;
  }
  .btn:hover { background: #d5d5d5; }
  .btn.small { padding: 4px 8px; font-size: 12px; }
  .content { padding: 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; background: #e8e8e8; padding: 10px;
    border: 1px solid #bbb; font-weight: 600; color: #444;
  }
  td { padding: 10px; border: 1px solid #ddd; color: #555; }
  .actions { display: flex; gap: 6px; }
</style>
</head>
<body>
<div class="screen">
  <div class="titlebar">
    <div class="left">← Назад &nbsp;&nbsp; Справочник ингредиентов</div>
    <button class="btn">+ Добавить</button>
  </div>
  <div class="content">
    <table>
      <thead>
        <tr>
          <th>Название</th>
          <th style="width: 200px;">Единица измерения</th>
          <th style="width: 160px;">Действия</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>Свёкла</td><td>г</td>
          <td><div class="actions">
            <button class="btn small">Изменить</button>
            <button class="btn small">Удалить</button>
          </div></td></tr>
        <tr><td>Капуста</td><td>г</td>
          <td><div class="actions">
            <button class="btn small">Изменить</button>
            <button class="btn small">Удалить</button>
          </div></td></tr>
        <tr><td>Молоко</td><td>мл</td>
          <td><div class="actions">
            <button class="btn small">Изменить</button>
            <button class="btn small">Удалить</button>
          </div></td></tr>
        <tr><td>Яйцо</td><td>шт</td>
          <td><div class="actions">
            <button class="btn small">Изменить</button>
            <button class="btn small">Удалить</button>
          </div></td></tr>
        <tr><td>Мука</td><td>г</td>
          <td><div class="actions">
            <button class="btn small">Изменить</button>
            <button class="btn small">Удалить</button>
          </div></td></tr>
        <tr><td>Сахар</td><td>г</td>
          <td><div class="actions">
            <button class="btn small">Изменить</button>
            <button class="btn small">Удалить</button>
          </div></td></tr>
        <tr><td>Соль</td><td>г</td>
          <td><div class="actions">
            <button class="btn small">Изменить</button>
            <button class="btn small">Удалить</button>
          </div></td></tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
