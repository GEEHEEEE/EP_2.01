<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>04 — Список покупок</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #e8e8e8; padding: 24px; color: #333; font-size: 14px;
  }
  .screen {
    background: #fff; border: 2px solid #555; border-radius: 4px;
    width: 950px; margin: 0 auto; overflow: hidden;
  }
  .titlebar {
    background: #d0d0d0; padding: 12px 16px; border-bottom: 1px solid #999;
    font-weight: 600;
  }
  .body { display: flex; }
  .col-left {
    width: 45%; border-right: 1px solid #ccc; padding: 16px;
    background: #fafafa;
  }
  .col-right { width: 55%; padding: 16px; }
  .col-title {
    font-weight: 600; margin-bottom: 12px; color: #444;
    border-bottom: 1px solid #ccc; padding-bottom: 6px;
  }
  .recipe-row {
    display: flex; align-items: center; padding: 8px 0;
    border-bottom: 1px dashed #ddd; font-size: 13px;
  }
  .recipe-row input[type=checkbox] { margin-right: 10px; }
  .recipe-row .name { flex: 1; }
  .recipe-row .servings {
    width: 60px; padding: 4px 6px; border: 1px solid #999;
    border-radius: 3px; font-size: 12px; text-align: center;
  }
  .recipe-row label { font-size: 12px; color: #777; margin: 0 6px 0 8px; }
  .btn {
    padding: 8px 14px; border: 1px solid #777; background: #e0e0e0;
    border-radius: 3px; font-size: 13px; cursor: pointer; color: #333;
  }
  .btn:hover { background: #d5d5d5; }
  .form-btn { margin-top: 14px; width: 100%; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; background: #e8e8e8; padding: 8px 10px;
    border: 1px solid #bbb; font-weight: 600; color: #444;
  }
  td { padding: 8px 10px; border: 1px solid #ddd; color: #555; }
  .footer-actions {
    margin-top: 14px; display: flex; gap: 8px; justify-content: flex-end;
  }
</style>
</head>
<body>
<div class="screen">
  <div class="titlebar">← Назад &nbsp;&nbsp; Список покупок</div>
  <div class="body">
    <div class="col-left">
      <div class="col-title">Выберите рецепты</div>

      <div class="recipe-row">
        <input type="checkbox" checked>
        <span class="name">Борщ</span>
        <label>Порций:</label>
        <input class="servings" type="text" value="4">
      </div>
      <div class="recipe-row">
        <input type="checkbox" checked>
        <span class="name">Оливье</span>
        <label>Порций:</label>
        <input class="servings" type="text" value="6">
      </div>
      <div class="recipe-row">
        <input type="checkbox">
        <span class="name">Блины</span>
        <label>Порций:</label>
        <input class="servings" type="text" value="3">
      </div>
      <div class="recipe-row">
        <input type="checkbox" checked>
        <span class="name">Компот из ягод</span>
        <label>Порций:</label>
        <input class="servings" type="text" value="8">
      </div>
      <div class="recipe-row">
        <input type="checkbox">
        <span class="name">Салат «Цезарь»</span>
        <label>Порций:</label>
        <input class="servings" type="text" value="2">
      </div>

      <button class="btn form-btn">Сформировать список</button>
    </div>

    <div class="col-right">
      <div class="col-title">Итоговый список</div>
      <table>
        <thead>
          <tr>
            <th>Ингредиент</th>
            <th style="width: 120px;">Количество</th>
            <th style="width: 90px;">Единица</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Свёкла</td><td>450</td><td>г</td></tr>
          <tr><td>Капуста</td><td>350</td><td>г</td></tr>
          <tr><td>Мясо</td><td>700</td><td>г</td></tr>
          <tr><td>Картофель</td><td>500</td><td>г</td></tr>
          <tr><td>Молоко</td><td>200</td><td>мл</td></tr>
          <tr><td>Яйцо</td><td>6</td><td>шт</td></tr>
          <tr><td>Сахар</td><td>150</td><td>г</td></tr>
        </tbody>
      </table>
      <div class="footer-actions">
        <button class="btn">Экспорт в файл</button>
        <button class="btn">Очистить</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
