<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>05 — Масштабирование порций</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #e8e8e8; padding: 24px; color: #333; font-size: 14px;
  }
  .screen {
    background: #fff; border: 2px solid #555; border-radius: 4px;
    width: 800px; margin: 0 auto; overflow: hidden;
  }
  .titlebar {
    background: #d0d0d0; padding: 12px 16px; border-bottom: 1px solid #999;
    font-weight: 600;
  }
  .content { padding: 20px; }
  .info-row {
    display: flex; align-items: center; margin-bottom: 14px;
    font-size: 13px;
  }
  .info-row label {
    width: 220px; color: #555; font-weight: 600;
  }
  .info-row .value { color: #555; }
  .info-row input {
    width: 100px; padding: 8px 10px; border: 1px solid #999;
    background: #fff; border-radius: 3px; font-size: 13px;
    text-align: center;
  }
  .section-title {
    font-weight: 600; margin: 22px 0 10px 0; font-size: 14px;
    color: #444; border-bottom: 1px solid #ccc; padding-bottom: 6px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; background: #e8e8e8; padding: 8px 10px;
    border: 1px solid #bbb; font-weight: 600; color: #444;
  }
  td { padding: 8px 10px; border: 1px solid #ddd; color: #555; }
  .footer {
    padding: 16px 20px; border-top: 1px solid #ccc;
    display: flex; justify-content: center; gap: 10px;
  }
  .btn {
    padding: 8px 16px; border: 1px solid #777; background: #e0e0e0;
    border-radius: 3px; font-size: 13px; cursor: pointer; color: #333;
  }
  .btn:hover { background: #d5d5d5; }
</style>
</head>
<body>
<div class="screen">
  <div class="titlebar">← Назад &nbsp;&nbsp; Рецепт: Борщ</div>
  <div class="content">
    <div class="info-row">
      <label>Исходное число порций:</label>
      <span class="value">4</span>
    </div>
    <div class="info-row">
      <label>Желаемое число порций:</label>
      <input type="text" value="6">
    </div>

    <div class="section-title">Пересчитанный состав</div>
    <table>
      <thead>
        <tr>
          <th>Ингредиент</th>
          <th style="width: 150px;">Количество</th>
          <th style="width: 120px;">Единица</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>Свёкла</td><td>450</td><td>г</td></tr>
        <tr><td>Капуста</td><td>300</td><td>г</td></tr>
        <tr><td>Мясо</td><td>750</td><td>г</td></tr>
        <tr><td>Картофель</td><td>450</td><td>г</td></tr>
        <tr><td>Морковь</td><td>150</td><td>г</td></tr>
        <tr><td>Лук</td><td>120</td><td>г</td></tr>
      </tbody>
    </table>
  </div>
  <div class="footer">
    <button class="btn">Применить</button>
    <button class="btn">Сбросить</button>
    <button class="btn">Назад</button>
  </div>
</div>
</body>
</html>
